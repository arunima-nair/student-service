spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.feign=DEBUG
logging.level.com.netflix=DEBUG
logging.level.org.springframework.web.client=DEBUG

spring.application.name=student-service

spring.profiles.active=default

spring.cloud.circuitbreaker.resilience4j.instances.studentService.slidingWindowSize=100
spring.cloud.circuitbreaker.resilience4j.instances.studentService.failureRateThreshold=50
spring.cloud.circuitbreaker.resilience4j.instances.studentService.waitDurationInOpenState=10000ms
spring.cloud.circuitbreaker.resilience4j.instances.studentService.permittedNumberOfCallsInHalfOpenState=5
spring.cloud.circuitbreaker.resilience4j.instances.studentService.maxRetries=3
spring.cloud.circuitbreaker.resilience4j.instances.studentService.retryTimeout=5000ms

resilience4j.retry.instances.studentService.maxAttempts=3
resilience4j.retry.instances.studentService.waitDuration=1000ms
resilience4j.retry.instances.studentService.enableExponentialBackoff=true
resilience4j.retry.instances.studentService.multiplier=2
resilience4j.retry.instances.studentService.maxWaitDuration=5000ms
resilience4j.timelimiter.instances.studentService.timeoutDuration=5000ms
